<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>BE UNSRS</title>

<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;800&family=Permanent+Marker&display=swap" rel="stylesheet">

<style>

/* =========================
BASE
========================= */
*{margin:0;padding:0;box-sizing:border-box}

body{
  font-family:Syne;
  overflow-x:hidden;
  color:#1b1c2a;
  background:#f7f1e1;
  transition:1s ease;
}

/* =========================
FULL DARK MODE BACKGROUND REPLACEMENT
========================= */
body.dark{
  color:#e6e6ff;
  background:
    radial-gradient(circle at 20% 20%, rgba(120,160,255,.25), transparent 40%),
    radial-gradient(circle at 80% 30%, rgba(180,120,255,.18), transparent 45%),
    radial-gradient(circle at 50% 80%, rgba(255,255,255,.08), transparent 50%),
    linear-gradient(180deg,#02030a,#000000);
}

body.dark::before{
  content:"";
  position:fixed;
  inset:0;
  background:
    radial-gradient(1px 1px at 10% 20%, #fff, transparent),
    radial-gradient(1px 1px at 25% 70%, #fff, transparent),
    radial-gradient(1px 1px at 60% 40%, #fff, transparent),
    radial-gradient(1px 1px at 80% 80%, #fff, transparent),
    radial-gradient(1px 1px at 40% 10%, #fff, transparent),
    radial-gradient(1px 1px at 70% 20%, #fff, transparent),
    radial-gradient(1px 1px at 30% 90%, #fff, transparent);
  opacity:.6;
  pointer-events:none;
}

body.dark::after{
  content:"";
  position:fixed;
  top:8%;
  right:10%;
  width:180px;
  height:180px;
  border-radius:50%;
  background:radial-gradient(circle,#ffffff 25%, rgba(255,255,255,.08) 60%, transparent 70%);
  opacity:.9;
  pointer-events:none;
}

/* =========================
TOGGLE
========================= */
.toggle{
  position:fixed;
  top:20px;
  right:20px;
  z-index:9999;
  width:48px;
  height:48px;
  border-radius:50%;
  border:none;
  cursor:pointer;
  background:#1f6f78;
  color:white;
  font-size:18px;
}

/* =========================
LIGHT BACKGROUND
========================= */
.paint-bg{
  position:fixed;
  inset:0;
  z-index:-2;
  background:
    radial-gradient(circle at 10% 20%, rgba(255,92,122,.35), transparent 40%),
    radial-gradient(circle at 80% 30%, rgba(31,111,120,.35), transparent 45%),
    radial-gradient(circle at 40% 80%, rgba(208,107,61,.35), transparent 45%),
    linear-gradient(180deg,#fff6e6,#f7f1e1);
  transition:1s ease;
}

body.dark .paint-bg{
  opacity:0;
}

/* =========================
LOADER
========================= */
.loader{
  position:fixed;
  inset:0;
  background:#f7f1e1;
  z-index:9999;
  display:flex;
  justify-content:center;
  align-items:center;
  font-size:30px;
  letter-spacing:10px;
}

body.dark .loader{
  background:#02030a;
  color:#fff;
}

/* =========================
SECTIONS
========================= */
section{
  padding:120px 10vw;
}

/* =========================
HERO
========================= */
.hero{
  height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
}

.hero h1{
  font-size:60px;
  font-family:"Permanent Marker";
}

/* =========================
SCRAPBOOK
========================= */
.scrapbook{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
  gap:20px;
}

.polaroid{
  background:white;
  padding:12px;
  box-shadow:0 20px 40px rgba(0,0,0,.1);
  transform:rotate(var(--r));
}

body.dark .polaroid{
  background:#0b0f1f;
  color:#e6e6ff;
}

/* =========================
VINYL
========================= */
.vinyl-section{
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:20px;
}

.vinyl{
  width:240px;
  height:240px;
  border-radius:50%;
  background:#111;
  cursor:pointer;
  position:relative;
}

.record{
  position:absolute;
  inset:18px;
  border-radius:50%;
  background:repeating-radial-gradient(circle,#222 0,#111 3px,#000 6px);
}

.label{
  position:absolute;
  inset:0;
  display:flex;
  align-items:center;
  justify-content:center;
  color:white;
  font-weight:800;
}

.vinyl.playing{
  animation:spin 2.5s linear infinite;
}

@keyframes spin{
  from{transform:rotate(0deg)}
  to{transform:rotate(360deg)}
}

/* =========================
WAVEFORM
========================= */
.waveform{
  display:flex;
  gap:3px;
  align-items:flex-end;
  height:60px;
  margin-top:10px;
}

.waveform span{
  width:4px;
  height:10px;
  background:#1f6f78;
  border-radius:2px;
}

.waveform.playing span{
  animation:wave .8s infinite ease-in-out;
}

@keyframes wave{
  0%,100%{height:10px}
  50%{height:55px}
}

/* =========================
ENERGY MAP (ADDED SECTION)
========================= */

.energy-section{
  text-align:center;
}

.energy-map{
  margin-top:30px;
  display:flex;
  justify-content:center;
  align-items:center;
  gap:12px;
  flex-wrap:wrap;
}

.dot{
  width:14px;
  height:14px;
  border-radius:50%;
  background:#ff5c7a;
  animation:energyPulse 1.2s infinite ease-in-out;
  box-shadow:0 0 10px rgba(255,92,122,.6);
}

.dot:nth-child(2){background:#1f6f78;animation-delay:.1s}
.dot:nth-child(3){background:#d06b3d;animation-delay:.2s}
.dot:nth-child(4){animation-delay:.3s}
.dot:nth-child(5){animation-delay:.4s}
.dot:nth-child(6){animation-delay:.5s}
.dot:nth-child(7){animation-delay:.6s}
.dot:nth-child(8){animation-delay:.7s}

@keyframes energyPulse{
  0%,100%{transform:scale(1);opacity:.5}
  50%{transform:scale(2);opacity:1}
}

</style>
</head>

<body>

<button class="toggle" onclick="document.body.classList.toggle('dark')">🌙</button>

<div class="paint-bg"></div>

<div class="loader">BE UNSRS</div>

<section class="hero">
  <div>
    <h1>BE UNSRS</h1>
    <p>creative chaos. structured imagination.</p>
  </div>
</section>

<section>
  <h2>Scrapbook</h2>
  <div class="scrapbook">
    <div class="polaroid" style="--r:-4deg"><img src="https://picsum.photos/300/200?1"></div>
    <div class="polaroid" style="--r:3deg"><img src="https://picsum.photos/300/200?2"></div>
  </div>
</section>

<section class="vinyl-section">
  <h2>Vinyl Player</h2>

  <div class="vinyl" id="vinyl"></div>
  <audio id="audio" src="yourz.mp3"></audio>
  <div class="waveform" id="waveform"></div>
</section>

<!-- ✅ ENERGY MAP SECTION -->
<section class="energy-section">
  <h2>⚡ Live Energy Map</h2>
  <div class="energy-map">
    <div class="dot"></div>
    <div class="dot"></div>
    <div class="dot"></div>
    <div class="dot"></div>
    <div class="dot"></div>
    <div class="dot"></div>
    <div class="dot"></div>
    <div class="dot"></div>
  </div>
</section>

<script>

window.onload=()=>{
  setTimeout(()=>{
    document.querySelector(".loader").style.display="none";
  },1000);
};

const vinyl=document.getElementById("vinyl");
const audio=document.getElementById("audio");
const waveform=document.getElementById("waveform");

let playing=false;

for(let i=0;i<18;i++){
  waveform.innerHTML += "<span></span>";
}

vinyl.onclick=()=>{
  if(!playing){
    audio.play();
    vinyl.classList.add("playing");
    waveform.classList.add("playing");
  }else{
    audio.pause();
    vinyl.classList.remove("playing");
    waveform.classList.remove("playing");
  }
  playing=!playing;
};

</script>

</body>
</html>
