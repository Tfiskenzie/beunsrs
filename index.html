<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>BE UNSRS</title>

<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;800&family=Permanent+Marker&display=swap" rel="stylesheet">

<style>

/* =========================
BASE
========================= */
*{margin:0;padding:0;box-sizing:border-box}

body{
  font-family:Syne;
  overflow-x:hidden;
  color:#1b1c2a;
  background:#f7f1e1;
}

/* =========================
COLORFUL PAINT BACKGROUND (UPDATED)
========================= */
.paint-bg{
  position:fixed;
  inset:0;
  z-index:-2;
  background:
    radial-gradient(circle at 10% 20%, rgba(255,92,122,.35), transparent 40%),
    radial-gradient(circle at 80% 30%, rgba(31,111,120,.35), transparent 45%),
    radial-gradient(circle at 40% 80%, rgba(208,107,61,.35), transparent 45%),
    linear-gradient(180deg,#fff6e6,#f7f1e1);
  filter:saturate(1.2);
}

/* floating blobs */
.blob{
  position:absolute;
  width:380px;
  height:380px;
  border-radius:50%;
  filter:blur(120px);
  opacity:.3;
  animation:float 18s infinite ease-in-out;
}

.blob:nth-child(1){background:#ff5c7a;top:10%;left:10%}
.blob:nth-child(2){background:#1f6f78;top:60%;left:70%}
.blob:nth-child(3){background:#d06b3d;top:40%;left:40%}

@keyframes float{
  0%,100%{transform:translateY(0)}
  50%{transform:translateY(-60px)}
}

/* =========================
LOADER
========================= */
.loader{
  position:fixed;
  inset:0;
  background:#f7f1e1;
  z-index:9999;
  display:flex;
  justify-content:center;
  align-items:center;
  font-size:30px;
  letter-spacing:10px;
}

/* =========================
SECTIONS
========================= */
section{
  padding:120px 10vw;
}

/* =========================
HERO (UPDATED FONT + SIZE)
========================= */
.hero{
  height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
}

.hero h1{
  font-size:60px; /* reduced */
  font-family:"Permanent Marker"; /* handwritten */
  letter-spacing:6px;
}

/* =========================
SCRAPBOOK
========================= */
.scrapbook{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
  gap:20px;
}

.polaroid{
  background:white;
  padding:12px;
  box-shadow:0 20px 40px rgba(0,0,0,.1);
  transform:rotate(var(--r));
}

.photo{
  width:100%;
  height:180px;
  object-fit:cover;
}

.caption{
  font-family:"Permanent Marker";
  padding:10px;
}

/* =========================
VINYL
========================= */
.vinyl-section{
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:20px;
}

.vinyl{
  width:240px;
  height:240px;
  border-radius:50%;
  background:radial-gradient(circle,#111 30%,#000 70%);
  position:relative;
  cursor:pointer;
}

.record{
  position:absolute;
  inset:18px;
  border-radius:50%;
  background:repeating-radial-gradient(circle,#222 0,#111 3px,#000 6px);
}

.label{
  position:absolute;
  inset:0;
  display:flex;
  align-items:center;
  justify-content:center;
  color:white;
  font-weight:800;
}

/* spinning */
.vinyl.playing{
  animation:spin 2.5s linear infinite;
}

@keyframes spin{
  from{transform:rotate(0deg)}
  to{transform:rotate(360deg)}
}

/* =========================
AUDIO WAVES (NEW)
========================= */
.waveform{
  display:flex;
  gap:3px;
  align-items:flex-end;
  height:60px;
  margin-top:10px;
}

.waveform span{
  width:4px;
  height:10px;
  background:#1f6f78;
  border-radius:2px;
  opacity:.7;
}

.waveform.playing span{
  animation:wave .8s infinite ease-in-out;
}

.waveform.playing span:nth-child(odd){
  animation-duration:1.1s;
}

@keyframes wave{
  0%,100%{height:10px}
  50%{height:55px}
}

/* =========================
SCRAPBOOK
========================= */
.scrapbook{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
  gap:20px;
}

.polaroid{
  background:white;
  padding:12px;
  box-shadow:0 20px 40px rgba(0,0,0,.1);
  transform:rotate(var(--r));
}

.photo{
  width:100%;
  height:180px;
  object-fit:cover;
}

.caption{
  font-family:"Permanent Marker";
  padding:10px;
}

/* =========================
MOBILE
========================= */
@media(max-width:768px){
  .hero h1{font-size:42px}
}

</style>
</head>

<body>

<!-- BACKGROUND -->
<div class="paint-bg">
  <div class="blob"></div>
  <div class="blob"></div>
  <div class="blob"></div>
</div>

<!-- LOADER -->
<div class="loader">BE UNSRS</div>

<!-- HERO -->
<section class="hero">
  <div>
    <h1>BE UNSRS</h1>
    <p>creative chaos. structured imagination.</p>
  </div>
</section>

<!-- SCRAPBOOK -->
<section>
  <h2>📒 Scrapbook</h2>
  <div class="scrapbook">

    <div class="polaroid" style="--r:-4deg">
      <img class="photo" src="https://picsum.photos/300/200?1"/>
      <div class="caption">Lagos nights</div>
    </div>

    <div class="polaroid" style="--r:3deg">
      <img class="photo" src="https://picsum.photos/300/200?2"/>
      <div class="caption">Street culture</div>
    </div>

  </div>
</section>

<!-- VINYL -->
<section class="vinyl-section">
  <h2>🎵 Vinyl Player</h2>

  <div class="vinyl" id="vinyl">
    <div class="record"></div>
    <div class="label">PLAY</div>
  </div>

  <audio id="audio" src="yourz.mp3"></audio>

  <!-- AUDIO WAVES -->
  <div class="waveform" id="waveform"></div>
</section>

<script>

/* loader */
window.onload=()=>{
  setTimeout(()=>{
    document.querySelector(".loader").style.display="none";
  },1000);
};

/* VINYL + AUDIO */
const vinyl=document.getElementById("vinyl");
const audio=document.getElementById("audio");
const waveform=document.getElementById("waveform");

let playing=false;

/* create wave bars */
for(let i=0;i<18;i++){
  const bar=document.createElement("span");
  waveform.appendChild(bar);
}

vinyl.onclick=()=>{
  if(!playing){
    audio.play();
    vinyl.classList.add("playing");
    waveform.classList.add("playing");
  }else{
    audio.pause();
    vinyl.classList.remove("playing");
    waveform.classList.remove("playing");
  }
  playing=!playing;
};

</script>

</body>
</html>
