<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>BE UNSRS</title>

<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;800&family=DM+Serif+Display&family=Permanent+Marker&display=swap" rel="stylesheet">

<script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/ScrollTrigger.min.js"></script>

<style>

/* =========================
BASE
========================= */
*{margin:0;padding:0;box-sizing:border-box}

body{
  font-family:Syne;
  background:#f7f1e1;
  overflow-x:hidden;
  color:#1b1c2a;
}

/* =========================
PAINT BACKGROUND
========================= */
.paint-bg{
  position:fixed;
  inset:0;
  z-index:-2;
}

.blob{
  position:absolute;
  width:400px;
  height:400px;
  border-radius:50%;
  filter:blur(120px);
  opacity:.35;
  animation:float 18s infinite ease-in-out;
}

.blob:nth-child(1){background:#ff5c7a;top:10%;left:10%}
.blob:nth-child(2){background:#1f6f78;top:60%;left:70%}
.blob:nth-child(3){background:#d06b3d;top:40%;left:40%}

@keyframes float{
  0%,100%{transform:translateY(0)}
  50%{transform:translateY(-60px)}
}

/* =========================
LOADER
========================= */
.loader{
  position:fixed;
  inset:0;
  background:#f7f1e1;
  z-index:9999;
  display:flex;
  justify-content:center;
  align-items:center;
  font-size:30px;
  letter-spacing:10px;
}

/* =========================
SECTIONS
========================= */
section{
  padding:120px 10vw;
}

/* =========================
HERO (UPDATED FONT SIZE)
========================= */
.hero{
  height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
}

.hero h1{
  font-size:80px; /* REDUCED AS REQUESTED */
  letter-spacing:10px;
}

/* =========================
SCRAPBOOK
========================= */
.scrapbook{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
  gap:20px;
}

.polaroid{
  background:white;
  padding:12px;
  box-shadow:0 20px 40px rgba(0,0,0,.1);
  transform:rotate(var(--r));
}

.photo{
  width:100%;
  height:180px;
  object-fit:cover;
}

.caption{
  font-family:"Permanent Marker";
  padding:10px;
}

/* =========================
CARTOON
========================= */
.cartoon{
  background:#fff7e6;
  border-radius:40px;
  padding:60px;
  text-align:center;
}

.sticker{
  display:inline-block;
  background:#ff5c7a;
  color:white;
  padding:10px 16px;
  border-radius:20px;
  margin:10px;
}

/* =========================
BUSINESS
========================= */
.business{
  background:white;
  border-radius:20px;
  box-shadow:0 20px 50px rgba(0,0,0,.08);
}

/* =========================
VINYL SPOTIFY SECTION (NEW)
========================= */
.vinyl-section{
  display:flex;
  justify-content:center;
  align-items:center;
  flex-direction:column;
}

.vinyl{
  width:240px;
  height:240px;
  border-radius:50%;
  background:radial-gradient(circle,#111 30%,#000 70%);
  position:relative;
  cursor:pointer;
  transition:.3s;
}

.vinyl:hover{
  transform:scale(1.05);
}

.record{
  position:absolute;
  inset:18px;
  border-radius:50%;
  background:repeating-radial-gradient(circle,#222 0,#111 3px,#000 6px);
}

.label{
  position:absolute;
  inset:0;
  display:flex;
  align-items:center;
  justify-content:center;
  color:white;
  font-weight:800;
}

/* spinning */
.vinyl.playing{
  animation:spin 2.5s linear infinite;
}

@keyframes spin{
  from{transform:rotate(0deg)}
  to{transform:rotate(360deg)}
}

/* =========================
POSTCARD COLLAGE (NEW)
========================= */
.postcard{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
  gap:12px;
  transform:rotate(-1deg);
}

.postcard img{
  width:100%;
  height:160px;
  object-fit:cover;
  border-radius:10px;
  box-shadow:0 10px 20px rgba(0,0,0,.15);
}

/* =========================
BUTTON
========================= */
.btn{
  padding:12px 18px;
  background:#1f6f78;
  color:white;
  border:none;
  border-radius:20px;
  cursor:pointer;
}

</style>
</head>

<body>

<div class="loader">BE UNSRS</div>

<!-- PAINT -->
<div class="paint-bg">
  <div class="blob"></div>
  <div class="blob"></div>
  <div class="blob"></div>
</div>

<!-- HERO -->
<section class="hero">
  <div>
    <h1>BE UNSRS</h1>
    <p>creative chaos. structured imagination.</p>
  </div>
</section>

<!-- SCRAPBOOK -->
<section>
  <h2>📒 Scrapbook</h2>
  <div class="scrapbook">

    <div class="polaroid" style="--r:-4deg">
      <img class="photo" src="https://picsum.photos/300/200?1"/>
      <div class="caption">Lagos nights</div>
    </div>

    <div class="polaroid" style="--r:3deg">
      <img class="photo" src="https://picsum.photos/300/200?2"/>
      <div class="caption">Street culture</div>
    </div>

    <div class="polaroid" style="--r:-2deg">
      <img class="photo" src="https://picsum.photos/300/200?3"/>
      <div class="caption">Chaos memory</div>
    </div>

  </div>
</section>

<!-- CARTOON -->
<section>
  <h2>🧸 Cartoon World</h2>
  <div class="cartoon">
    <div class="sticker">PLAY</div>
    <div class="sticker">FUN</div>
    <div class="sticker">LOL</div>
  </div>
</section>

<!-- BUSINESS -->
<section>
  <h2>💼 Business Mode</h2>
  <div class="business">
    <p style="padding:20px">Structured creative services for modern brands.</p>
  </div>
</section>

<!-- VINYL SPOTIFY SECTION -->
<section class="vinyl-section">
  <h2>🎵 Listen on Spotify</h2>

  <div class="vinyl" id="vinyl">
    <div class="record"></div>
    <div class="label">PLAY</div>
  </div>

  <button class="btn" onclick="openSpotify()">Connect Spotify</button>
</section>

<!-- POSTCARD COLLAGE -->
<section>
  <h2>🖼 Postcard Collage</h2>

  <div class="postcard">
    <img src="https://picsum.photos/300/200?10"/>
    <img src="https://picsum.photos/300/200?11"/>
    <img src="https://picsum.photos/300/200?12"/>
    <img src="https://picsum.photos/300/200?13"/>
    <img src="https://picsum.photos/300/200?14"/>
    <img src="https://picsum.photos/300/200?15"/>
  </div>
</section>

<script>

/* loader */
window.onload = ()=>{
  setTimeout(()=>{
    document.querySelector(".loader").style.display="none";
  },1000);
};

/* vinyl animation */
const vinyl=document.getElementById("vinyl");

vinyl.onclick=()=>{
  vinyl.classList.toggle("playing");
  openSpotify();
};

/* spotify redirect (placeholder) */
function openSpotify(){
  window.open("https://open.spotify.com/login","_blank");
}

</script>

</body>
</html>
