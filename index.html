<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>BE UNSRS</title>

<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;800&family=DM+Serif+Display&display=swap" rel="stylesheet">

<script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/ScrollTrigger.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@studio-freight/lenis@1.0.42/bundled/lenis.min.js"></script>

<style>
:root{
  --sky:#F6E7C1;
  --sand:#E7D3B0;
  --rust:#D06B3D;
  --teal:#1F6F78;
  --coral:#FF5C7A;
  --ink:#1B1C2A;
}

body{
  margin:0;
  font-family:Syne;
  background:linear-gradient(180deg,var(--sky),var(--sand));
  overflow-x:hidden;
  color:#1a1a1a;
}

/* ========================= */
/* DARK MODE FULL OVERLAY */
/* ========================= */
body.dark{
  color:#e6e6ff;
  background:
    radial-gradient(circle at 20% 20%, rgba(120,160,255,.25), transparent 40%),
    radial-gradient(circle at 80% 30%, rgba(180,120,255,.18), transparent 45%),
    linear-gradient(180deg,#02030a,#000);
}

body.dark::before{
  content:"";
  position:fixed;
  inset:0;
  background:
    radial-gradient(1px 1px at 10% 20%, #fff, transparent),
    radial-gradient(1px 1px at 60% 40%, #fff, transparent),
    radial-gradient(1px 1px at 80% 80%, #fff, transparent);
  opacity:.6;
  pointer-events:none;
}

body.dark::after{
  content:"";
  position:fixed;
  top:8%;
  right:10%;
  width:180px;
  height:180px;
  border-radius:50%;
  background:radial-gradient(circle,#fff 25%,transparent 70%);
  opacity:.8;
  pointer-events:none;
}

/* ========================= */
/* TOGGLE */
/* ========================= */
.toggle{
  position:fixed;
  top:20px;
  right:20px;
  z-index:9999;
  width:48px;
  height:48px;
  border-radius:50%;
  border:none;
  cursor:pointer;
  background:#1f6f78;
  color:white;
}

/* ========================= */
/* BACKGROUND */
/* ========================= */
.paint-bg{
  position:fixed;
  inset:0;
  z-index:-2;
  background:
    radial-gradient(circle at 10% 20%, rgba(255,92,122,.35), transparent 40%),
    radial-gradient(circle at 80% 30%, rgba(31,111,120,.35), transparent 45%),
    radial-gradient(circle at 40% 80%, rgba(208,107,61,.35), transparent 45%),
    linear-gradient(180deg,#fff6e6,#f7f1e1);
}

body.dark .paint-bg{opacity:0}

/* ========================= */
/* HERO */
/* ========================= */
.hero{
  height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
}

.hero h1{
  font-size:60px;
  font-family:"Permanent Marker";
}

/* ========================= */
/* SCRAPBOOK */
/* ========================= */
.scrapbook{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
  gap:20px;
}

.polaroid{
  background:#fff;
  padding:12px;
  border-radius:10px;
}

/* ========================= */
/* VINYL */
/* ========================= */
.vinyl-section{
  display:flex;
  flex-direction:column;
  align-items:center;
}

.vinyl{
  width:240px;
  height:240px;
  border-radius:50%;
  background:#000;
  cursor:pointer;
}

.record{
  position:absolute;
  inset:18px;
  border-radius:50%;
}

.vinyl.playing{
  animation:spin 2.5s linear infinite;
}

@keyframes spin{
  from{transform:rotate(0)}
  to{transform:rotate(360deg)}
}

/* ========================= */
/* WAVEFORM */
/* ========================= */
.waveform{
  display:flex;
  gap:3px;
  align-items:flex-end;
  height:60px;
}

.waveform span{
  width:4px;
  height:10px;
  background:#1f6f78;
}

.waveform.playing span{
  animation:wave .8s infinite ease-in-out;
}

@keyframes wave{
  0%,100%{height:10px}
  50%{height:55px}
}

/* ========================= */
/* CHAOS FEED */
/* ========================= */
section{
  padding:120px 10vw;
}

.feed{
  display:grid;
  gap:15px;
}

.post{
  background:rgba(255,255,255,.7);
  padding:15px;
  border-radius:10px;
}

/* ========================= */
/* GAME */
/* ========================= */
.game{
  text-align:center;
}

.game button{
  padding:12px 25px;
  border:none;
  border-radius:30px;
  background:#1f6f78;
  color:white;
  cursor:pointer;
}

/* ========================= */
/* MESSAGES */
/* ========================= */
.wall{
  display:flex;
  gap:15px;
  flex-wrap:wrap;
}

.note{
  background:#fff;
  padding:15px;
  border-radius:10px;
}

/* ========================= */
/* ENERGY */
/* ========================= */
.pulse-grid{
  display:flex;
  gap:10px;
}

.pulse{
  width:40px;
  height:40px;
  border-radius:50%;
  background:#ff5c7a;
  animation:pulse 1.2s infinite;
}

@keyframes pulse{
  50%{transform:scale(1.5)}
}

</style>
</head>

<body>

<button class="toggle" onclick="toggleDark()">🌙</button>

<div class="paint-bg"></div>

<!-- HERO -->
<section class="hero">
  <h1>BE UNSRS</h1>
</section>

<!-- SCRAPBOOK -->
<section>
  <h2>Scrapbook</h2>
  <div class="scrapbook">
    <div class="polaroid"><img src="https://picsum.photos/300/200?1"></div>
    <div class="polaroid"><img src="https://picsum.photos/300/200?2"></div>
  </div>
</section>

<!-- VINYL -->
<section class="vinyl-section">
  <h2>Vinyl Player</h2>
  <div class="vinyl" id="vinyl"></div>
  <audio id="audio" src="yourz.mp3"></audio>
  <div class="waveform" id="waveform"></div>
</section>

<!-- CHAOS FEED -->
<section>
  <h2>Chaos Feed</h2>
  <div class="feed">
    <div class="post">🔥 BE UNSRS energy detected</div>
    <div class="post">🎧 Lagos creativity overload</div>
    <div class="post">💥 system instability = fun</div>
  </div>
</section>

<!-- GAME -->
<section class="game">
  <h2>Tap Game</h2>
  <button onclick="addScore()">CLICK</button>
  <h3 id="score">0</h3>
</section>

<!-- MESSAGES -->
<section>
  <h2>Messages</h2>
  <div class="wall">
    <div class="note">“this is chaos in a good way”</div>
    <div class="note">“I love this universe”</div>
  </div>
</section>

<!-- ENERGY -->
<section>
  <h2>Energy Map</h2>
  <div class="pulse-grid">
    <div class="pulse"></div>
    <div class="pulse"></div>
    <div class="pulse"></div>
  </div>
</section>

<script>

/* DARK MODE */
function toggleDark(){
  document.body.classList.toggle("dark");
}

/* VINYL */
const vinyl=document.getElementById("vinyl");
const audio=document.getElementById("audio");
const waveform=document.getElementById("waveform");

let playing=false;

for(let i=0;i<18;i++){
  waveform.innerHTML += "<span></span>";
}

vinyl.onclick=()=>{
  if(!playing){
    audio.play();
    vinyl.classList.add("playing");
    waveform.classList.add("playing");
  }else{
    audio.pause();
    vinyl.classList.remove("playing");
    waveform.classList.remove("playing");
  }
  playing=!playing;
};

/* GAME */
let score=0;
function addScore(){
  score++;
  document.getElementById("score").innerText=score;
}

</script>

</body>
</html>
