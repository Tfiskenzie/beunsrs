<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>BE UNSRS</title>

<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;800&family=DM+Serif+Display&family=Permanent+Marker&display=swap" rel="stylesheet">

<script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/ScrollTrigger.min.js"></script>

<style>

/* =========================
BASE (LIGHT MODE)
========================= */
*{margin:0;padding:0;box-sizing:border-box}

body{
  font-family:Syne;
  background:#f7f1e1;
  overflow-x:hidden;
  color:#1b1c2a;
  transition:0.8s ease;
}

/* =========================
DARK MODE (SPACE THEME)
========================= */
body.dark{
  background:#05060f;
  color:#e6e6ff;
}

body.dark .blob{
  background:#7c4dff !important;
  opacity:.25;
  filter:blur(140px);
}

/* =========================
DARK MODE STAR FIELD
========================= */
body.dark::before{
  content:"";
  position:fixed;
  inset:0;
  background:
    radial-gradient(1px 1px at 20% 30%, white, transparent),
    radial-gradient(1px 1px at 60% 70%, white, transparent),
    radial-gradient(1px 1px at 80% 20%, white, transparent),
    radial-gradient(1px 1px at 40% 80%, white, transparent);
  opacity:.4;
  pointer-events:none;
}

/* =========================
TOGGLE BUTTON
========================= */
.toggle{
  position:fixed;
  top:20px;
  right:20px;
  z-index:9999;
  padding:10px 14px;
  border:none;
  border-radius:20px;
  cursor:pointer;
  background:#1f6f78;
  color:white;
}

/* =========================
PAINT BACKGROUND
========================= */
.paint-bg{
  position:fixed;
  inset:0;
  z-index:-2;
  transition:1s ease;
}

.blob{
  position:absolute;
  width:400px;
  height:400px;
  border-radius:50%;
  filter:blur(120px);
  opacity:.35;
  animation:float 18s infinite ease-in-out;
  transition:1s ease;
}

.blob:nth-child(1){background:#ff5c7a;top:10%;left:10%}
.blob:nth-child(2){background:#1f6f78;top:60%;left:70%}
.blob:nth-child(3){background:#d06b3d;top:40%;left:40%}

@keyframes float{
  0%,100%{transform:translateY(0)}
  50%{transform:translateY(-60px)}
}

/* =========================
LOADER
========================= */
.loader{
  position:fixed;
  inset:0;
  background:#f7f1e1;
  z-index:9999;
  display:flex;
  justify-content:center;
  align-items:center;
  font-size:30px;
  letter-spacing:10px;
}

/* =========================
SECTIONS
========================= */
section{
  padding:120px 10vw;
}

/* =========================
HERO
========================= */
.hero{
  height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
}

.hero h1{
  font-size:80px;
  letter-spacing:10px;
}

/* =========================
SCRAPBOOK
========================= */
.scrapbook{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
  gap:20px;
}

.polaroid{
  background:white;
  padding:12px;
  box-shadow:0 20px 40px rgba(0,0,0,.1);
  transform:rotate(var(--r));
}

.photo{
  width:100%;
  height:180px;
  object-fit:cover;
}

.caption{
  font-family:"Permanent Marker";
  padding:10px;
}

/* =========================
ABOUT US (UPDATED)
========================= */
.about{
  background:white;
  border-radius:20px;
  box-shadow:0 20px 50px rgba(0,0,0,.08);
  padding:30px;
}

/* =========================
VINYL
========================= */
.vinyl-section{
  display:flex;
  justify-content:center;
  align-items:center;
  flex-direction:column;
  gap:20px;
}

.vinyl{
  width:240px;
  height:240px;
  border-radius:50%;
  background:radial-gradient(circle,#111 30%,#000 70%);
  position:relative;
  cursor:pointer;
}

.record{
  position:absolute;
  inset:18px;
  border-radius:50%;
  background:repeating-radial-gradient(circle,#222 0,#111 3px,#000 6px);
}

.label{
  position:absolute;
  inset:0;
  display:flex;
  align-items:center;
  justify-content:center;
  color:white;
  font-weight:800;
}

.vinyl.playing{
  animation:spin 2.5s linear infinite;
}

@keyframes spin{
  from{transform:rotate(0deg)}
  to{transform:rotate(360deg)}
}

/* =========================
DARK MODE OVERRIDES
========================= */
body.dark .about{
  background:#0b0f1f;
  color:#e6e6ff;
}

body.dark .polaroid{
  background:#0b0f1f;
  color:#e6e6ff;
}

body.dark .loader{
  background:#05060f;
  color:#e6e6ff;
}

</style>
</head>

<body>

<!-- TOGGLE -->
<button class="toggle" onclick="toggleDark()">🌙 Dark Mode</button>

<!-- LOADER -->
<div class="loader">BE UNSRS</div>

<!-- BACKGROUND -->
<div class="paint-bg">
  <div class="blob"></div>
  <div class="blob"></div>
  <div class="blob"></div>
</div>

<!-- HERO -->
<section class="hero">
  <div>
    <h1>BE UNSRS</h1>
    <p>creative chaos. structured imagination.</p>
  </div>
</section>

<!-- SCRAPBOOK -->
<section>
  <h2>📒 Scrapbook</h2>
  <div class="scrapbook">

    <div class="polaroid" style="--r:-4deg">
      <img class="photo" src="https://picsum.photos/300/200?1"/>
      <div class="caption">Lagos nights</div>
    </div>

    <div class="polaroid" style="--r:3deg">
      <img class="photo" src="https://picsum.photos/300/200?2"/>
      <div class="caption">Street culture</div>
    </div>

  </div>
</section>

<!-- ABOUT US -->
<section>
  <h2>💼 About Us</h2>
  <div class="about">
    <p>
      We build creative systems that blend culture, design, and storytelling into digital experiences.
    </p>
  </div>
</section>

<!-- VINYL -->
<section class="vinyl-section">
  <h2>🎵 Vinyl Player</h2>

  <div class="vinyl" id="vinyl">
    <div class="record"></div>
    <div class="label">PLAY</div>
  </div>

  <audio id="audio" src="yourz.mp3"></audio>
</section>

<script>

/* loader */
window.onload=()=>{
  setTimeout(()=>{
    document.querySelector(".loader").style.display="none";
  },1000);
};

/* vinyl play */
const vinyl=document.getElementById("vinyl");
const audio=document.getElementById("audio");

let playing=false;

vinyl.onclick=()=>{
  if(!playing){
    audio.play();
    vinyl.classList.add("playing");
  }else{
    audio.pause();
    vinyl.classList.remove("playing");
  }
  playing=!playing;
};

/* DARK MODE */
function toggleDark(){
  document.body.classList.toggle("dark");
}

</script>

</body>
</html>
